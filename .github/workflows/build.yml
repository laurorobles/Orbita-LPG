name: Build and Release Orbita-LPG

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            artifact_name: Windows-Build
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DJUCE_COPY_PLUGIN_AFTER_BUILD=FALSE
          - name: macOS (Universal)
            os: macos-14
            artifact_name: macOS-Build
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DJUCE_COPY_PLUGIN_AFTER_BUILD=FALSE
          - name: Linux (x64)
            os: ubuntu-latest
            artifact_name: Linux-Build
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DJUCE_COPY_PLUGIN_AFTER_BUILD=FALSE

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev libfreetype6-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev ninja-build

      - name: Setup MSVC Developer Command Prompt (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja (Mac/Win)
        if: runner.os != 'Linux'
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" ${{ matrix.cmake_args }}

      - name: Build Plugin & Standalone
        run: |
          cmake --build build --config Release --parallel

      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          
          # VST3
          for path in "build/OrbitaLPG_artefacts/VST3/Orbita-LPG.vst3" "build/OrbitaLPG_artefacts/Release/VST3/Orbita-LPG.vst3" "build/OrbitaLPG_artefacts/VST3/Extasis *.vst3" "build/OrbitaLPG_artefacts/Release/VST3/Extasis *.vst3"; do
            if [ -e "$path" ]; then cp -r "$path" artifacts/; fi
          done
          
          # AU
          for path in "build/OrbitaLPG_artefacts/AU/Orbita-LPG.component" "build/OrbitaLPG_artefacts/Release/AU/Orbita-LPG.component"; do
            if [ -e "$path" ]; then cp -r "$path" artifacts/; fi
          done
          
          # CLAP
          for path in "build/OrbitaLPG_artefacts/CLAP/Orbita-LPG.clap" "build/OrbitaLPG_artefacts/Release/CLAP/Orbita-LPG.clap"; do
            if [ -e "$path" ]; then cp -r "$path" artifacts/; fi
          done
          
          # Standalone Win
          for path in "build/OrbitaLPG_artefacts/Standalone/Orbita-LPG.exe" "build/OrbitaLPG_artefacts/Release/Standalone/Orbita-LPG.exe"; do
            if [ -e "$path" ]; then cp -r "$path" artifacts/; fi
          done
          
          # Standalone Mac
          for path in "build/OrbitaLPG_artefacts/Standalone/Orbita-LPG.app" "build/OrbitaLPG_artefacts/Release/Standalone/Orbita-LPG.app"; do
            if [ -e "$path" ]; then cp -r "$path" artifacts/; fi
          done
          
          # Docs & Installer
          if [ -d "installer" ]; then
            cp -r installer artifacts/
            chmod +x artifacts/installer/INSTALL_MAC.command 2>/dev/null || true
            chmod +x artifacts/installer/INSTALL_LINUX.sh 2>/dev/null || true
          fi
          for doc in MANUAL.md README.md PRESENTATION.md TECHNICAL.md FICHA_TECNICA.md ARCHITECTURE.md RELEASE_RULES.md; do
            if [ -f "$doc" ]; then cp "$doc" artifacts/; fi
          done

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Windows-Build
          path: release-files/Windows/

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macOS-Build
          path: release-files/macOS/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Linux-Build
          path: release-files/Linux/

      - name: Package Release Files
        run: |
          mkdir final-assets
          cd release-files
          zip -r ../final-assets/Orbita-LPG-Windows.zip Windows/
          zip -r ../final-assets/Orbita-LPG-macOS.zip macOS/
          zip -r ../final-assets/Orbita-LPG-Linux.zip Linux/
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Orbita-LPG ${{ github.ref_name }}"
          body: |
            ### 🚀 Lanzamiento Oficial ${{ github.ref_name }}
            
            Este release incluye los binarios e instaladores oficiales para **Orbita-LPG** en Windows, macOS y Linux.
            
            **Formatos incluidos:**
            - **VST3**
            - **CLAP**
            - **Audio Unit (AU)** (macOS)
            - **Standalone** (Aplicación independiente)
            
            **Documentación:**
            - Manual de Usuario (`MANUAL.md`)
            - Ficha Técnica (`TECHNICAL.md`)
            - Presentación (`PRESENTATION.md`)
            - Arquitectura DSP (`ARCHITECTURE.md`)
            
            ---
            
            ### 🔑 Licencia y Activación
            Consigue tu clave de licencia oficial en **[Gumroad](http://laurorobles.gumroad.com)**.
            *El plugin funcionará en modo demo (silenciado a los 10 minutos de uso continuo) hasta ingresar la licencia.*
          generate_release_notes: true
          files: final-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
