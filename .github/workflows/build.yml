name: Build and Release Orbita-LPG

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            artifact_name: Windows-Build
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DJUCE_COPY_PLUGIN_AFTER_BUILD=FALSE
          - name: Linux (x64)
            os: ubuntu-latest
            artifact_name: Linux-Build
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DJUCE_COPY_PLUGIN_AFTER_BUILD=FALSE

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev libfreetype6-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev ninja-build

      - name: Setup MSVC Developer Command Prompt (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja (Mac/Win)
        if: runner.os != 'Linux'
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" ${{ matrix.cmake_args }}

      - name: Build Plugin & Standalone
        run: |
          cmake --build build --config Release --parallel

      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p artifacts

          for path in "build/OrbitaLPG_artefacts/VST3/Orbita-LPG.vst3" "build/OrbitaLPG_artefacts/Release/VST3/Orbita-LPG.vst3"; do
            if [ -e "$path" ]; then cp -r "$path" artifacts/; fi
          done

          for path in "build/OrbitaLPG_artefacts/AU/Orbita-LPG.component" "build/OrbitaLPG_artefacts/Release/AU/Orbita-LPG.component"; do
            if [ -e "$path" ]; then cp -r "$path" artifacts/; fi
          done

          for path in "build/OrbitaLPG_artefacts/CLAP/Orbita-LPG.clap" "build/OrbitaLPG_artefacts/Release/CLAP/Orbita-LPG.clap"; do
            if [ -e "$path" ]; then cp -r "$path" artifacts/; fi
          done

          for path in "build/OrbitaLPG_artefacts/Standalone/Orbita-LPG.exe" "build/OrbitaLPG_artefacts/Release/Standalone/Orbita-LPG.exe" "build/OrbitaLPG_artefacts/Standalone/Orbita-LPG.app" "build/OrbitaLPG_artefacts/Release/Standalone/Orbita-LPG.app" "build/OrbitaLPG_artefacts/Standalone/Orbita-LPG" "build/OrbitaLPG_artefacts/Release/Standalone/Orbita-LPG"; do
            if [ -e "$path" ]; then cp -r "$path" artifacts/; fi
          done

          if [ -d "installer" ]; then
            cp -r installer artifacts/
            chmod +x artifacts/installer/INSTALL_MAC.command 2>/dev/null || true
            chmod +x artifacts/installer/INSTALL_LINUX.sh 2>/dev/null || true
          fi
          for doc in LICENSE README.md MANUAL.md TECHNICAL.md ARCHITECTURE.md PRESENTATION.md; do
            if [ -f "$doc" ]; then cp "$doc" artifacts/; fi
          done

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Windows-Build
          path: release-files/Windows/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Linux-Build
          path: release-files/Linux/

      - name: Package Release Files
        run: |
          mkdir final-assets
          cd release-files
          zip -r ../final-assets/Orbita-LPG-Windows.zip Windows/
          zip -r ../final-assets/Orbita-LPG-Linux.zip Linux/
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Orbita-LPG ${{ github.ref_name }}"
          body: |
            ### 🪐 Orbita-LPG ${{ github.ref_name }} — Free & Open Source (GPLv3)

            **Orbita-LPG** is now 100% free and open-source under the GNU General Public License v3.0 — no license keys, no demo timers, no restrictions.

            **Included Formats:**
            - **VST3** (Windows, macOS, Linux)
            - **CLAP** (Windows, macOS, Linux)
            - **Audio Unit / AU** (macOS)
            - **Standalone** (Windows, macOS, Linux)

            **Highlights in v2.0.0:**
            - 🔓 **100% Free & Open Source (GPLv3)** — All DRM and demo timers removed.
            - 🌊 **True 1st-Order ADAA Wavefolder** — Alias-free harmonic folding with zero latency.
            - 🥁 **Real Groove Swing & 32-Step Euclidean Engine** — Sample-accurate swung PPQ timing, unified DSP/UI Euclidean patterns, and 0–32 pulses per voice.
            - 📼 **Stereo RE-201 Space Echo** — Quadrature LFO Wow/Flutter, tape feedback warmth filter, and smooth pitch-glide delay modulation.
            - 🎨 **Refined Resizable UI** — Live Vactrol-glow clickable radar, color-coded Buchla 259/281/292 sections, stereo master VU meter, keyboard shortcuts, and embedded cross-platform artwork.

            **Documentation included:** `README.md`, `MANUAL.md`, `TECHNICAL.md`, `ARCHITECTURE.md`, `PRESENTATION.md`.
          generate_release_notes: true
          files: final-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
